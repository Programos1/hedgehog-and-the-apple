<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc6e8" />
    <meta name="description" content="Nibbles' Little Adventure – naučná skákačka pro malé děti. © 2026 Tomáš Horák" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Nibbles' Little Adventure</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2f4a2a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #2f4a2a; color: #fff8e6; font: 600 28px/1.3 "Trebuchet MS", sans-serif;
        align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 24px;
      }
      #rotate .phone { width: 70px; height: 120px; border: 6px solid #fff8e6; border-radius: 14px; animation: turn 2s ease-in-out infinite; margin-bottom: 24px; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      /* Only phones/tablets held in portrait get the "please rotate" overlay. */
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>Otoč telefon na šířku 🦔</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
